# Dependency updates, once a week, grouped so each ecosystem opens at most a
# couple of pull requests (security fixes are always opened right away).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tiptap:
        patterns: ["@tiptap/*", "prosemirror-*"]
      tauri:
        patterns: ["@tauri-apps/*"]
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(npm)"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(cargo)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
