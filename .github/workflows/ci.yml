# Tests on every push and pull request; also run by the release workflow
# before building.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # includes the Markdown fidelity check over fixtures/vault

  # Rust commands (vault files, Git, Grammalecte), on macOS like the app.
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
      - run: npm ci
      # The Tauri build needs the frontend and the Grammalecte companion.
      - run: ./scripts/build-grammar.sh && npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
