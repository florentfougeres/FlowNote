# Builds the macOS .dmg (Apple Silicon) and prepares a draft GitHub release
# when a version tag is pushed (git tag 0.1.0 && git push origin 0.1.0). The
# release's body is the version's section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: macos-latest # Apple Silicon runner: builds the arm64 app
    env:
      # Bundling Plotly (a 4.8 MB CommonJS file) needs more than Node's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v7 # builds the Grammalecte companion (scripts/build-grammar.sh)
        with:
          version: "0.13.0" # pinned: looking up "latest" can fail on a GitHub API hiccup
      - run: npm ci
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          {
            echo "body<<EOF_NOTES"
            scripts/release-notes.sh "$(node -p "require('./package.json').version")"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FlowNote ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --bundles dmg
