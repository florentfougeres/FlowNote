# Builds the macOS .dmg (Apple Silicon) and prepares a draft GitHub release
# when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: macos-latest # Apple Silicon runner: builds the arm64 app
    env:
      # Bundling Plotly (a 4.8 MB CommonJS file) needs more than Node's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v7 # builds the Grammalecte companion (scripts/build-grammar.sh)
        with:
          version: "0.13.0" # pinned: looking up "latest" can fail on a GitHub API hiccup
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FlowNote ${{ github.ref_name }}
          releaseBody: |
            Pour Mac Apple Silicon (M1 et suivants).

            Premier lancement : l'application n'est pas signée par Apple. Ouvrez *Réglages Système → Confidentialité et sécurité* puis **Ouvrir quand même**, ou lancez `xattr -cr /Applications/FlowNote.app`.
          releaseDraft: true
          prerelease: false
          args: --bundles dmg
