# Builds the two macOS apps (Apple Silicon) and prepares a draft GitHub release
# when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0):
# FlowNote (Tauri) and FlowNote Swift (the native shell, native/), one .dmg each.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: macos-latest # Apple Silicon runner: builds the arm64 app
    env:
      # Bundling Plotly (a 4.8 MB CommonJS file) needs more than Node's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v7 # builds the Grammalecte companion (scripts/build-grammar.sh)
        with:
          version: "0.13.0" # pinned: looking up "latest" can fail on a GitHub API hiccup
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FlowNote ${{ github.ref_name }}
          releaseBody: |
            Pour Mac Apple Silicon (M1 et suivants).

            Deux applications, à installer au choix ou côte à côte :
            - **FlowNote** (`FlowNote_…_aarch64.dmg`) : l'app Tauri.
            - **FlowNote Swift** (`FlowNote-Swift_…_aarch64.dmg`) : la même app dans une fenêtre macOS native (barre latérale, onglets, Liquid Glass). macOS 26 ou plus récent.

            Premier lancement : les applications ne sont pas signées par Apple. Ouvrez *Réglages Système → Confidentialité et sécurité* puis **Ouvrir quand même**, ou lancez `xattr -cr /Applications/FlowNote.app` (ou `"/Applications/FlowNote Swift.app"`).
          releaseDraft: true
          prerelease: false
          args: --bundles dmg

  # FlowNote Swift: the native shell, added to the draft release made above.
  swift:
    needs: build
    runs-on: macos-26 # Xcode 26 or later: SwiftUI and Liquid Glass
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      TAURI_TARGET: aarch64-apple-darwin # names the Grammalecte companion without rustc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
      - run: npm ci
      - run: ./scripts/build-grammar.sh
      - run: DEVELOPER_DIR="$(xcode-select -p)" native/build.sh
      - name: Package the .dmg and add it to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="FlowNote-Swift_${version}_aarch64.dmg"
          staging="$(mktemp -d)"
          cp -R "native/build/FlowNote Swift.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "FlowNote Swift" -srcfolder "$staging" -ov -format UDZO "$dmg"
          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
