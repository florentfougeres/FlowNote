[package]
name = "flownote"
version = "0.25.0"
description = "FlowNote : éditeur de blocs pour un vault Obsidian versionné avec Git"
authors = ["Florent Fougères"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The backend (src-tauri/core), a library without Tauri.
[workspace]
members = ["core"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
flownote-core = { path = "core" }
